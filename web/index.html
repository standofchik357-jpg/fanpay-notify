<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Notify</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;

            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 24px;

            padding: 40px 25px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 16px;
        }

        p {
            color: #aaaaaa;
            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;

            border-radius: 30px;
            background: #252525;

            font-size: 14px;
        }

        .logo {
            margin-top: 35px;
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">🔧</div>

        <h1>Технические работы</h1>

        <p>
            Мы переносим Market Notify
            в новое веб-приложение.
        </p>

        <p style="margin-top: 10px;">
            Скоро все функции будут доступны
            в новом интерфейсе.
        </p>

        <div class="status">
            🚀 Скоро вернёмся
        </div>

        <div class="logo">
            🟢 Market Notify
        </div>

    </div>

</body>
</html>
